services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speech_studio
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speechpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speech -d speech_studio"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://speech:speechpass@postgres:5432/speech_studio
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ADMIN_EMAIL: admin@local.test
      ADMIN_PASSWORD: Admin@12345
      SECRET_KEY: local-development-secret
      SESSION_TTL_SECONDS: 43200
      PASSWORD_RESET_TTL_SECONDS: 1800
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
