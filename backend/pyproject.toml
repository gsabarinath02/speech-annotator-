[project]
name = "outcomes-speech-api"
version = "1.0.0"
description = "FastAPI backend for production speech collection."
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.124.2",
  "uvicorn[standard]==0.38.0",
  "python-multipart==0.0.20",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1"
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2"
]

[tool.setuptools.packages.find]
include = ["speech_api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
